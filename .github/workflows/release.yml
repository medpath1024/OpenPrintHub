name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build all platforms
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          
          mkdir -p dist
          
          # Darwin AMD64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-darwin-amd64 ./cmd/oph
          
          # Darwin ARM64
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-darwin-arm64 ./cmd/oph
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-windows-amd64.exe ./cmd/oph
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-linux-amd64 ./cmd/oph
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-linux-arm64 ./cmd/oph

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create archives
        run: |
          cd dist
          
          # Create tar.gz for Unix platforms
          for file in oph-darwin-* oph-linux-*; do
            tar -czvf "${file}.tar.gz" "${file}"
          done
          
          # Create zip for Windows
          for file in oph-windows-*.exe; do
            zip "${file%.exe}.zip" "${file}"
          done

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > CHANGELOG_RELEASE.md
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> CHANGELOG_RELEASE.md
          else
            echo "## Initial Release" > CHANGELOG_RELEASE.md
            echo "First public release of OpenPrintHub." >> CHANGELOG_RELEASE.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG_RELEASE.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
