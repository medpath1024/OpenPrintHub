name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.21'

permissions:
  contents: write

jobs:
  # Build Linux binaries
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-linux-amd64 ./cmd/oph
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-linux-arm64 ./cmd/oph
          
          # Create tar.gz archives
          cd dist
          tar -czvf oph-linux-amd64.tar.gz oph-linux-amd64
          tar -czvf oph-linux-arm64.tar.gz oph-linux-arm64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/*.tar.gz

  # Build Windows installer
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Windows binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION} -H=windowsgui"
          
          mkdir -p dist scripts/windows
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o scripts/windows/oph.exe ./cmd/oph

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y

      - name: Create Windows installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version scripts\windows\installer.nsi
          Move-Item scripts\windows\OpenPrintHub-Setup.exe dist\OpenPrintHub-$version-windows-amd64-setup.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-setup.exe

  # Build macOS PKG
  build-macos:
    name: Build macOS PKG
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            arch: x64
          - goarch: arm64
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build macOS binary
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          
          mkdir -p dist
          
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "${LDFLAGS}" -o dist/oph-darwin-${{ matrix.goarch }} ./cmd/oph

      - name: Create PKG
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x scripts/macos/create-pkg.sh
          
          BINARY_PATH=dist/oph-darwin-${{ matrix.goarch }} \
          VERSION=${VERSION} \
          ARCH=${{ matrix.arch }} \
          OUTPUT_DIR=dist \
          ./scripts/macos/create-pkg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg-${{ matrix.arch }}
          path: dist/*.pkg

  # Create GitHub Release
  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "## What's Changed" > CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> CHANGELOG_RELEASE.md
          else
            echo "## 🎉 Initial Release" > CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "First public release of OpenPrintHub - a high-performance, cross-platform silent printing service." >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "### Features" >> CHANGELOG_RELEASE.md
            echo "- REST API for print job management" >> CHANGELOG_RELEASE.md
            echo "- WebSocket support for real-time status updates" >> CHANGELOG_RELEASE.md
            echo "- Support for PDF, RAW, and image printing" >> CHANGELOG_RELEASE.md
            echo "- Cross-platform support (Windows, macOS, Linux)" >> CHANGELOG_RELEASE.md
            echo "- Web-based admin dashboard" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            echo "### Downloads" >> CHANGELOG_RELEASE.md
            echo "| Platform | Download |" >> CHANGELOG_RELEASE.md
            echo "|----------|----------|" >> CHANGELOG_RELEASE.md
            echo "| Windows (64-bit) | \`OpenPrintHub-*-windows-amd64-setup.exe\` |" >> CHANGELOG_RELEASE.md
            echo "| macOS (Intel) | \`OpenPrintHub-*-x64.pkg\` |" >> CHANGELOG_RELEASE.md
            echo "| macOS (Apple Silicon) | \`OpenPrintHub-*-arm64.pkg\` |" >> CHANGELOG_RELEASE.md
            echo "| Linux (64-bit) | \`oph-linux-amd64.tar.gz\` |" >> CHANGELOG_RELEASE.md
            echo "| Linux (ARM64) | \`oph-linux-arm64.tar.gz\` |" >> CHANGELOG_RELEASE.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG_RELEASE.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
