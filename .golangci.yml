version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - misspell
    - bodyclose
  exclusions:
    rules:
      # Exclude test files from errcheck
      - path: ".*_test\\.go"
        linters:
          - errcheck
      # Exclude mock files
      - path: ".*mock_.*"
        linters:
          - unused
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/medpath1024/OpenPrintHub
