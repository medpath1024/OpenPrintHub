{{define "jobs.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - OpenPrintHub</title>
    <script src="/static/js/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 min-h-screen fixed">
            <div class="p-6">
                <h1 class="text-xl font-bold text-gray-800">
                    <span class="text-blue-600">Open</span>PrintHub
                </h1>
                <p class="text-sm text-gray-500 mt-1">v0.1.0</p>
            </div>
            <nav class="mt-4">
                <a href="/" class="nav-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="/printers" class="nav-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                    </svg>
                    <span>Printers</span>
                </a>
                <a href="/jobs" class="nav-link active">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    <span>Jobs</span>
                </a>
            </nav>
            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-200">
                <div class="text-xs text-gray-500">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                        Service Running
                    </div>
                    <div>Port: 16800</div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-8">
<div class="mb-8">
    <h2 class="text-2xl font-bold text-gray-800">Print Jobs</h2>
    <p class="text-gray-500 mt-1">View print job history</p>
</div>

<div class="bg-white rounded-lg shadow-sm border border-gray-200">
    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
        <h3 class="text-lg font-semibold text-gray-800">Job History</h3>
        <button hx-get="/partials/jobs" 
                hx-target="#jobs-list"
                hx-swap="innerHTML"
                class="btn btn-secondary">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Refresh
        </button>
    </div>
    <div id="jobs-list" 
         hx-get="/partials/jobs" 
         hx-trigger="load, refresh, every 10s">
        {{template "jobs_partial.html" .}}
    </div>
</div>
        </main>
    </div>

    <script>
        // WebSocket connection for real-time updates
        let ws;
        function connectWebSocket() {
            const wsUrl = 'ws://' + window.location.host + '/v1/ws';
            ws = new WebSocket(wsUrl);
            ws.onopen = function() {
                console.log('WebSocket connected to', wsUrl);
            };
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'job_status') {
                    htmx.trigger('#jobs-list', 'refresh');
                    htmx.trigger('#stats-panel', 'refresh');
                }
            };
            ws.onerror = function(err) {
                console.log('WebSocket error:', err);
            };
            ws.onclose = function() {
                console.log('WebSocket closed, reconnecting...');
                setTimeout(connectWebSocket, 3000);
            };
        }
        connectWebSocket();
    </script>
</body>
</html>
{{end}}
