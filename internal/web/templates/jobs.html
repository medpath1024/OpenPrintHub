{{define "jobs.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - OpenPrintHub</title>
    <script src="/static/js/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex">
        {{template "sidebar" .}}

        <!-- Main Content -->
        <main class="main-content">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Print Jobs</h2>
                <p class="text-gray-500 mt-1">View print job history</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Job History</h3>
                    <button hx-get="/partials/jobs" 
                            hx-target="#jobs-list"
                            hx-swap="innerHTML"
                            class="btn btn-secondary">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Refresh
                    </button>
                </div>
                <div id="jobs-list" 
                     hx-get="/partials/jobs" 
                     hx-trigger="load, refresh, every 10s">
                    {{template "jobs_partial.html" .}}
                </div>
            </div>

            <div id="job-info-modal" class="modal-overlay" onclick="closeJobInfoOnBackdrop(event)">
                <div class="modal-panel">
                    <div class="modal-panel-header">
                        <h3 id="job-info-title" class="card-title">Job Info</h3>
                        <div class="modal-actions">
                            <button id="job-info-export-btn" type="button" class="btn btn-primary btn-sm" onclick="exportJobInfo()" disabled>
                                Export JSON
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="closeJobInfoModal()">Close</button>
                        </div>
                    </div>
                    <div id="job-info-loading" class="htmx-indicator modal-loading">Loading details...</div>
                    <div id="job-info-content" class="modal-panel-body">
                        <p class="text-sm text-gray-500">Click the Info button on a job to load detailed diagnostics.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let activeJobInfoId = '';

        function openJobInfoModal(jobID) {
            const modal = document.getElementById('job-info-modal');
            const title = document.getElementById('job-info-title');
            if (!modal || !title) return;

            activeJobInfoId = jobID || '';
            updateJobInfoExportButton();
            title.textContent = jobID ? ('Job Info - ' + jobID) : 'Job Info';
            modal.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeJobInfoModal() {
            const modal = document.getElementById('job-info-modal');
            if (!modal) return;

            modal.classList.remove('open');
            document.body.classList.remove('modal-open');
            activeJobInfoId = '';
            updateJobInfoExportButton();
        }

        function closeJobInfoOnBackdrop(event) {
            if (event.target && event.target.id === 'job-info-modal') {
                closeJobInfoModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeJobInfoModal();
            }
        });

        function exportJobInfo() {
            if (!activeJobInfoId) return;
            const url = '/partials/jobs/' + encodeURIComponent(activeJobInfoId) + '/info/export';
            window.location.href = url;
        }

        function updateJobInfoExportButton() {
            const exportBtn = document.getElementById('job-info-export-btn');
            if (!exportBtn) return;
            exportBtn.disabled = !activeJobInfoId;
        }

        updateJobInfoExportButton();
    </script>
    {{template "scripts"}}
</body>
</html>
{{end}}
